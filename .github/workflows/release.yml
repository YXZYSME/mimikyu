name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (e.g. v0.2.0)"
        required: true
        type: string
      only_npm_mcp:
        description: "Skip binary build/crates/PyPI and publish only npm + Official MCP Registry for an existing tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "2"
  MOZ_CRASHREPORTER_DISABLE: "1"
  MOZ_CRASHREPORTER: "0"
  MOZ_CRASHREPORTER_NO_REPORT: "1"

jobs:
  verify:
    name: Verify Release Tag & Tests
    if: ${{ !inputs.only_npm_mcp }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.ref }}

      - name: Verify Cargo.toml, Cargo.lock & CHANGELOG.md match tag
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "error: invalid release tag '$TAG_NAME' (expected vMAJOR.MINOR.PATCH)" >&2
              exit 1
              ;;
          esac
          ./scripts/check-version-sync.sh --tag "$TAG_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy (--all-targets -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install local Chromium & Firefox for release verification
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npx --yes playwright install --with-deps chromium firefox

      - name: Run workspace tests & E2E harness self-test
        run: |
          cargo test --workspace --locked
          python3 e2e/run_e2e.py --self-test

  build:
    name: Build Tarball (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.ref }}

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross-linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Cache Cargo registry & target build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary (${{ matrix.target }})
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}" -p mimikyu-cli

      - name: Package mimikyu-${{ matrix.target }}.tar.gz
        env:
          COPYFILE_DISABLE: "1"
        run: |
          STAGE_DIR="$RUNNER_TEMP/stage-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/mimikyu" "$STAGE_DIR/mimikyu"
          chmod 0755 "$STAGE_DIR/mimikyu"
          cp README.md CHANGELOG.md "$STAGE_DIR/"
          for lic in LICENSE LICENSE-MIT LICENSE-APACHE NOTICE; do
            if [ -f "$lic" ]; then
              cp "$lic" "$STAGE_DIR/"
            fi
          done
          mkdir -p dist
          (cd "$STAGE_DIR" && tar -czf "$GITHUB_WORKSPACE/dist/mimikyu-${{ matrix.target }}.tar.gz" *)

      - name: Upload release tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/mimikyu-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Checksums, Provenance Attestation & GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.ref }}

      - name: Download all built tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      - name: Verify all 4 platform tarballs & generate SHA256SUMS
        run: |
          cd release-assets
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            test -f "mimikyu-${target}.tar.gz"
          done
          sha256sum mimikyu-*.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Render updated Homebrew formula (mimikyu.rb)
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          REL_VER="${TAG_NAME#v}"
          SHA_DARWIN_ARM64=$(awk '$2 == "mimikyu-aarch64-apple-darwin.tar.gz" {print $1}' release-assets/SHA256SUMS)
          SHA_DARWIN_X86_64=$(awk '$2 == "mimikyu-x86_64-apple-darwin.tar.gz" {print $1}' release-assets/SHA256SUMS)
          SHA_LINUX_ARM64=$(awk '$2 == "mimikyu-aarch64-unknown-linux-gnu.tar.gz" {print $1}' release-assets/SHA256SUMS)
          SHA_LINUX_X86_64=$(awk '$2 == "mimikyu-x86_64-unknown-linux-gnu.tar.gz" {print $1}' release-assets/SHA256SUMS)

          sed \
            -e "s#YXZYSME/mimikyu#${REPO_SLUG}#g" \
            -e "s#version \"[^\"]*\"#version \"${REL_VER}\"#g" \
            -e "s#/releases/download/v[^/]*/#/releases/download/v${REL_VER}/#g" \
            -e "s#PLACEHOLDER_SHA256_DARWIN_ARM64#${SHA_DARWIN_ARM64}#g" \
            -e "s#PLACEHOLDER_SHA256_DARWIN_X86_64#${SHA_DARWIN_X86_64}#g" \
            -e "s#PLACEHOLDER_SHA256_LINUX_ARM64#${SHA_LINUX_ARM64}#g" \
            -e "s#PLACEHOLDER_SHA256_LINUX_X86_64#${SHA_LINUX_X86_64}#g" \
            packaging/homebrew/mimikyu.rb > release-assets/mimikyu.rb

      - name: Attest SLSA build provenance for release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/mimikyu-*.tar.gz
            release-assets/SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          REL_VER="${TAG_NAME#v}"
          awk -v ver="$REL_VER" '
            $0 ~ "^## \\[" ver "\\] - " { in_sec = 1; next }
            in_sec && ($0 ~ "^## \\[" || $0 ~ "^\\[[^]]+\\]: ") { exit 0 }
            in_sec { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/RELEASE_NOTES.md"

          cat >> "$RUNNER_TEMP/RELEASE_NOTES.md" <<EOF

          ---

          ### Install or Update (\`${TAG_NAME}\`)

          \`\`\`sh
          # Fresh install
          curl -fsSL https://raw.githubusercontent.com/${REPO_SLUG}/${TAG_NAME}/install.sh | MIMIKYU_REPO=${REPO_SLUG} sh -s -- --version ${TAG_NAME}

          # Upgrade an existing installation
          curl -fsSL https://raw.githubusercontent.com/${REPO_SLUG}/main/install.sh | MIMIKYU_REPO=${REPO_SLUG} sh -s -- --update

          # Verify GitHub SLSA Artifact Attestation (optional, requires gh >= 2.49)
          gh attestation verify mimikyu-<target>.tar.gz --repo ${REPO_SLUG}
          \`\`\`
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: mimikyu ${{ inputs.tag || github.ref_name }}
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/mimikyu-aarch64-apple-darwin.tar.gz
            release-assets/mimikyu-x86_64-apple-darwin.tar.gz
            release-assets/mimikyu-x86_64-unknown-linux-gnu.tar.gz
            release-assets/mimikyu-aarch64-unknown-linux-gnu.tar.gz
            release-assets/SHA256SUMS
            release-assets/mimikyu.rb

      - name: Update Homebrew Tap Formula (optional when HOMEBREW_TAP_TOKEN is configured)
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'YXZYSME/homebrew-tap' }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping automatic tap push (release-assets/mimikyu.rb attached to GitHub Release)."
            exit 0
          fi
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          cp release-assets/mimikyu.rb "$TAP_DIR/Formula/mimikyu.rb"
          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mimikyu.rb
          if ! git diff --cached --quiet; then
            git commit -m "mimikyu ${TAG_NAME#v}"
            git push origin HEAD
          fi

  publish-crates:
    name: Publish Crates to crates.io (Trusted Publishing OIDC)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.ref }}

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io via GitHub OIDC
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: |
          cargo publish --locked -p mimikyu-core
          cargo publish --locked -p mimikyu-cli
          cargo publish --locked -p mimikyu

  publish-mcp:
    name: Publish npm (mimikyu-mcp, saengil-mimikyu, mimikyu-cli) & Official MCP Registry (OIDC)
    needs: publish
    if: ${{ always() && (needs.publish.result == 'success' || inputs.only_npm_mcp) && !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.ref }}

      - name: Set up Node.js 24 (pure OIDC, no dummy NODE_AUTH_TOKEN)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure npm >= 11.5.1 for Trusted Publishing OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: Publish npm packages (mimikyu-mcp, saengil-mimikyu, mimikyu-cli) with OIDC provenance
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          REL_VER="${TAG_NAME#v}"
          for pkg_dir in mimikyu-mcp saengil-mimikyu mimikyu-cli; do
            if curl -fsSL "https://registry.npmjs.org/${pkg_dir}/${REL_VER}" >/dev/null 2>&1; then
              echo "${pkg_dir}@${REL_VER} already published on npm; skipping."
            else
              (cd "packaging/npm/$pkg_dir" && npm publish --provenance --access public --loglevel verbose)
            fi
          done

      - name: Install Cosign & verify mcp-publisher CLI
        uses: sigstore/cosign-installer@v3.8.2

      - name: Download, verify, and publish server.json to Official MCP Registry
        run: |
          set -eu
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL "$base_url/$archive" -o "$archive"
          curl -fsSL "$base_url/$archive.sigstore.json" -o "$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar -xzf "$archive"
          ./mcp-publisher login github-oidc --registry https://registry.modelcontextprotocol.io
          ./mcp-publisher publish server.json --registry https://registry.modelcontextprotocol.io

  publish-pypi:
    name: Publish Python Package (mimikyu) to PyPI (Trusted Publishing OIDC)
    needs: publish
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.ref }}

      - name: Install uv & build mimikyu wheel + sdist
        uses: astral-sh/setup-uv@v5

      - name: Build Python distribution artifacts
        working-directory: packaging/pypi
        run: uv build --out-dir dist

      - name: Publish to PyPI via Trusted Publishing OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packaging/pypi/dist/
