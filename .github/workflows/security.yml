name: Supply-Chain Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run every Monday at 06:00 UTC to catch newly published RustSec advisories
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo-deny (Licenses, Advisories, Bans & Sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --config deny.toml all

  cargo-audit:
    name: cargo-audit (RustSec Advisory Database)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock against RustSec
        run: cargo audit --deny warnings
