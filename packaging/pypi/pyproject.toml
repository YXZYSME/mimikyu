[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "mimikyu"
version = "0.2.0"
description = "Fast dual-engine (Chromium CDP & Firefox WebDriver BiDi) browser automation, session isolation, and 33-tool MCP server for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [
  { name = "Saengil (YXZYS)" }
]
keywords = [
  "browser-automation",
  "mcp",
  "model-context-protocol",
  "cdp",
  "webdriver-bidi",
  "chromium",
  "firefox",
  "ai-agents",
  "mimikyu",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YXZYSME/mimikyu"
Repository = "https://github.com/YXZYSME/mimikyu"
Issues = "https://github.com/YXZYSME/mimikyu/issues"
Changelog = "https://github.com/YXZYSME/mimikyu/blob/main/CHANGELOG.md"

[project.scripts]
mimikyu = "mimikyu_pypi.cli:main"
mimikyu-mcp = "mimikyu_pypi.cli:main_mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/mimikyu_pypi"]
