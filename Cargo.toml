[workspace]
resolver = "2"
members = ["crates/mimikyu-core", "crates/mimikyu-cli", "crates/mimikyu"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
description = "Fast browser automation, session/profile isolation, and environment consistency control plane for AI agents"
homepage = "https://github.com/YXZYSME/mimikyu"
repository = "https://github.com/YXZYSME/mimikyu"
readme = "README.md"
keywords = ["browser", "automation", "mcp", "cdp", "webdriver-bidi"]
categories = ["command-line-utilities", "development-tools::testing", "web-programming", "asynchronous"]

[workspace.metadata.binstall]
pkg-url = "https://github.com/YXZYSME/mimikyu/releases/download/v{ version }/mimikyu-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.12"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink", "std"] }
libc = "0.2"
mimikyu-core = { version = "0.2.0", path = "crates/mimikyu-core" }
parking_lot = "0.12"
rand = "0.10"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.26", features = ["v4"] }
