[package]
name = "mimikyu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fast browser automation, session/profile isolation, and environment consistency CLI, daemon, and MCP server for AI agents"
homepage = "https://github.com/YXZYSME/mimikyu"
repository = "https://github.com/YXZYSME/mimikyu"
documentation = "https://docs.rs/mimikyu-cli"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.binstall]
pkg-url = "https://github.com/YXZYSME/mimikyu/releases/download/v{ version }/mimikyu-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "mimikyu"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
mimikyu-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
